services:
  app:
    build: .
    restart: unless-stopped
    # Container lauscht intern auf 8000 (kein fester Host-Port; Coolify-Proxy publiziert).
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
