[project]
name = "mutualsky"
version = "0.1.0"
description = "Friendship on Atmosphere / Bsky – Bluesky Follow-Swap Webapp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-jsx>=0.4",
    "oxyde>=0.7",
    "PyJWT>=2.9",
    "cryptography>=42",
    "httpx>=0.27",
    "authlib>=1.3",
    "dnspython>=2.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/models.pyi", "migrations"]

[tool.ruff.lint]
# B008: `Depends(...)` in FastAPI argument defaults is the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Provider glue: intentionally surfaces arbitrary upstream errors / silent
# fallbacks in identity resolution and OAuth discovery.
"app/oauth/*" = ["BLE001", "S110"]
"app/routes/*" = ["BLE001"]
"app/bluesky/actions.py" = ["BLE001"]